name: MedAI CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q MedAI_Integrated_v1
      - name: Run integration tests
        run: python -m unittest discover -s MedAI_Integrated_v1/tests -p 'test_*.py' -v
